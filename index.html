<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sportday Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ff7a1a; --purple:#6b2fb3; --gold:#ffb627;
  --ink:#2a1640; --muted:#7a6390; --card:#ffffffcc; --line:#2a164022;
  --sky1:#7fd3ff; --sky2:#ffe3a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--sky2);color:var(--ink);font-family:"Mitr",sans-serif;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}

/* daytime backdrop (same as schedule day hero) */
.sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.sun{position:fixed;left:50%;top:-9vh;width:34vh;transition:top .9s cubic-bezier(.7,0,.2,1),width .9s cubic-bezier(.7,0,.2,1);aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle,#fff6b0,#ffc533 60%,#ff9a1a);box-shadow:0 0 80px 30px #ffcf4d88}
.sun::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:repeating-conic-gradient(#ffd25a55 0 8deg,transparent 8deg 22deg);animation:spin 40s linear infinite;z-index:-1;mask:radial-gradient(circle,#000 45%,transparent 70%)}
@keyframes spin{to{rotate:360deg}}
.cloud{position:fixed;height:5vh;border-radius:5vh;background:#fff;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:6.4vh;height:6.4vh;left:2.4vh;top:-3.1vh}.cloud::after{width:4.6vh;height:4.6vh;left:7.2vh;top:-2vh}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hills{position:fixed;left:-5%;right:-5%;bottom:0;height:26vh}
.hills svg{width:100%;height:100%}
.floaty{position:fixed;z-index:0;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-18px) rotate(4deg)}}

.wrap{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr;padding:3vh 4vw 7vh;gap:5vh}

.head{text-align:center}
.eyebrow{display:inline-block;font:500 1.8vh "Mitr";letter-spacing:.2em;padding:.7vh 1.8vh;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.title{margin-top:.6vh;font:600 11vh/1 "Mitr";letter-spacing:-.02em;color:#fff;-webkit-text-stroke:.3vh var(--ink);paint-order:stroke fill;text-shadow:.8vh .8vh 0 var(--orange)}
.title span{display:inline-block;padding-top:.3em;margin-top:-.3em;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*60ms)}
@keyframes pop{from{transform:translateY(60px) scale(.4) rotate(-12deg);opacity:0}}

/* scores */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3vw;min-height:0}
.team{--c:var(--orange);position:relative;height:100%;max-height:64vh;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;padding:3vh 2vw 2.4vh;border-radius:4vh;background:var(--card);backdrop-filter:blur(8px);border:.45vh solid var(--ink);box-shadow:1.2vh 1.2vh 0 var(--c);transition:transform .4s}
.team.p{--c:var(--purple)}
.team .name{font:600 5.6vh/1 "Mitr";color:#fff;padding:1.2vh 5vh 1.6vh;border-radius:99px;background:var(--c);border:.35vh solid var(--ink)}
.team .num{font:600 34vh/1 "Mitr";font-variant-numeric:tabular-nums;color:#fff;-webkit-text-stroke:.5vh var(--ink);paint-order:stroke fill;text-shadow:1.4vh 1.4vh 0 var(--c)}
.team .num.bump{animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.team .stats{display:flex;gap:1.4vh}
.team .stats span{font:500 3.4vh "Mitr";padding:.6vh 2.4vh;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.team .stats b{color:var(--ink);font-weight:600}
.crown{position:absolute;top:-9.5vh;left:50%;width:11vh;translate:-50% 0;opacity:0;transform:translateY(2vh) scale(.6);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.team.lead .crown{opacity:1;transform:none;animation:float 2.4s ease-in-out infinite .5s}
@keyframes float{50%{transform:translateY(-1vh) rotate(-4deg)}}
.team.lead{transform:scale(1.03)}
.vs{font:600 8vh "Mitr";color:#fff;-webkit-text-stroke:.3vh var(--ink);paint-order:stroke fill;text-shadow:.6vh .6vh 0 var(--gold)}

/* screens: score | cover | mae */
.wrap{transition:opacity .6s,transform .6s}
body:not([data-screen="score"]) .wrap{opacity:0;transform:scale(.92);pointer-events:none}
body[data-screen="cover"] .sun{top:12vh;width:52vh}

.cover{position:fixed;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;padding-bottom:10vh;opacity:0;pointer-events:none;transition:opacity .6s}
body[data-screen="cover"] .cover{opacity:1}
.cover .eyebrow{font-size:2.6vh;padding:1vh 2.6vh;background:#ffffffd9}
.cover h1{margin-top:1vh;font:600 30vh/.92 "Mitr";letter-spacing:-.02em;color:#fff;-webkit-text-stroke:.6vh var(--ink);paint-order:stroke fill;text-shadow:1.6vh 1.6vh 0 var(--orange)}
.cover h1 span{display:inline-block;padding-top:.3em;margin-top:-.3em}
body[data-screen="cover"] .cover h1 span{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*60ms + .2s)}
.cover .date{margin-top:3vh;font:500 5vh "Mitr"}
.cover .floaty{position:absolute}

.mae{position:fixed;inset:0;z-index:3;display:flex;pointer-events:none}
.side{flex:1 1 0;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1vh;color:#fff;text-align:center;padding-top:7vh;transition:translate .8s cubic-bezier(.7,0,.2,1),flex-grow .8s cubic-bezier(.7,0,.2,1)}
.side .sub{font:500 3.2vh "Mitr";opacity:.9}
.side h2{font:600 10vh/1.12 "Mitr";padding-top:.15em}
.side.o{--tc:#ffa04d;background:radial-gradient(circle at 30% 30%,#ffa04d,#ff6a00);translate:-100% 0}
.side.p{--tc:#c79bff;background:radial-gradient(circle at 70% 30%,#8f4ee0,#4b1a8f);translate:100% 0}
.side.on{translate:0 0}
.side.gone{flex-grow:0}
.side.solo{align-items:flex-start;text-align:left;padding:26vh 0 0 8vw}
.side.solo .sub{font-size:4vh}
.side.solo h2{position:relative;z-index:2;font-size:12vh}
.side.solo .crew{position:absolute;inset:0}
.side.solo .grp{left:71%;width:min(58%,94vh)}
.crew{position:relative;width:100%;flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-end}
.crew::before{content:"";position:absolute;left:50%;bottom:0;translate:-50% 0;width:min(70%,60vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffffff70,#fff0 68%)}
.grp{position:absolute;left:50%;bottom:0;width:min(100%,74vh);translate:-50% 110%;transition:translate .5s ease-in}
.side.on .grp{translate:-50% 8%;transition:translate .9s cubic-bezier(.2,1.2,.4,1) .4s}
.grp img{display:block;width:100%;filter:drop-shadow(0 12px 22px #0006)}
.grp b{position:absolute;bottom:11%;translate:-50% 0;white-space:nowrap;font:600 4.2vh/1.1 "Mitr";padding:.8vh 3vh 1.1vh;border-radius:99px;background:#fff;color:#1a0d2e;border:.45vh solid #1a0d2e;box-shadow:.8vh .8vh 0 #1a0d2e;--d:1.3s}
.grp b.l{rotate:-4deg}.grp b.r{rotate:4deg}
.grp b.boss{bottom:19%;z-index:2;font-size:6vh;padding:1.2vh 4.4vh 1.6vh;background:#1a0d2e;color:#fff;border:.5vh solid #fff;box-shadow:0 0 0 .6vh #1a0d2e,1vh 1vh 0 .6vh #1a0d2e;--d:1.1s}
.grp b.boss small{position:absolute;left:50%;top:-3.4vh;translate:-50% 0;font:600 2.8vh/1 "Mitr";letter-spacing:.06em;padding:.6vh 2vh .8vh;border-radius:99px;background:#ffc533;color:#1a0d2e;border:.4vh solid #1a0d2e}
.side.on .grp b{animation:tagpop .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
@keyframes tagpop{from{scale:0}}
.vsbadge{position:absolute;left:50%;top:22%;translate:-50% -50%;width:22vh;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);font:600 9vh "Mitr";box-shadow:0 0 0 1.4vh #ffffff55,0 3vh 8vh #0005;scale:0;rotate:-180deg;transition:scale .4s,rotate .4s}
body[data-screen="mae"] .vsbadge{scale:1;rotate:0deg;transition:scale .6s cubic-bezier(.2,1.6,.4,1) 1s,rotate .6s cubic-bezier(.2,1.6,.4,1) 1s}

/* operator controls (fade when idle) */
.ctl{position:fixed;z-index:5;display:flex;gap:1vh;transition:opacity .5s}
body.idle .ctl{opacity:0;pointer-events:none}
body.idle{cursor:none}
.ctl button{width:6vh;height:6vh;border-radius:1.6vh;border:1px solid var(--line);background:var(--card);font:600 2.6vh "Mitr";backdrop-filter:blur(8px)}
.ctl button:hover{border-color:var(--orange)}
.ctl.tl{left:2vh;top:2vh}

/* burst on score */
.burst{position:fixed;z-index:4;pointer-events:none;font:600 12vh "Mitr";color:#fff;-webkit-text-stroke:.4vh var(--ink);paint-order:stroke fill;text-shadow:.8vh .8vh 0 var(--c);animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-4vh) scale(1.1)}100%{opacity:0;transform:translate(-50%,-22vh) scale(1)}}
.conf{position:fixed;z-index:4;top:-2vh;width:1.2vh;height:2vh;border-radius:.3vh;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
</style>
</head>
<body data-screen="score">
<svg width="0" height="0" style="position:absolute">
  <symbol id="pumpkin" viewBox="0 0 100 90"><rect x="46" y="2" width="8" height="16" rx="3" fill="#3d7a2a"/><ellipse cx="30" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="70" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="50" cy="54" rx="24" ry="35" fill="#ff7f1f"/><path d="M30 42l10 10H22zM70 42l8 10H60zM28 64q22 18 44 0l-6 8-6-6-6 8-6-8-6 8-6-6z" fill="#3a1a05"/></symbol>
  <symbol id="ghost" viewBox="0 0 80 90"><path d="M8 48Q8 6 40 6t32 42v38l-8-8-8 8-8-8-8 8-8-8-8 8-8-8-8 8z" fill="#fff" stroke="#2a1640" stroke-width="3"/><ellipse cx="29" cy="40" rx="5" ry="8" fill="#2a1640"/><ellipse cx="51" cy="40" rx="5" ry="8" fill="#2a1640"/><ellipse cx="40" cy="58" rx="6" ry="5" fill="#2a1640"/></symbol>
  <symbol id="crown" viewBox="0 0 64 48"><path d="M4 40 8 10l14 14L32 4l10 20 14-14 4 30z" fill="#ffc533" stroke="#2a1640" stroke-width="2.5" stroke-linejoin="round"/><rect x="4" y="40" width="56" height="6" rx="2" fill="#ff9a1a" stroke="#2a1640" stroke-width="2.5"/></symbol>
</svg>

<div class="sky"></div>
<div class="sun"></div>
<div class="cloud" style="top:12%;width:14vh;animation-duration:48s;animation-delay:-10s"></div>
<div class="cloud" style="top:30%;width:19vh;animation-duration:70s;animation-delay:-40s"></div>
<div class="cloud" style="top:7%;width:11vh;animation-duration:58s;animation-delay:-25s"></div>
<div class="hills"><svg viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 140Q160 40 330 120T680 100T1000 120V300H0z" fill="#ffb15c"/><path d="M0 200Q200 110 420 190T820 170T1000 190V300H0z" fill="#ff8a2a"/></svg></div>

<div class="cover">
  <svg class="floaty" style="left:12%;top:22%;width:12vh;animation-delay:-2s"><use href="#ghost"/></svg>
  <svg class="floaty" style="right:14%;top:42%;width:10vh;animation-delay:-.6s"><use href="#ghost"/></svg>
  <svg class="floaty" style="left:6%;bottom:6%;width:18vh"><use href="#pumpkin"/></svg>
  <svg class="floaty" style="right:8%;bottom:9%;width:14vh;animation-delay:-1.5s"><use href="#pumpkin"/></svg>
  <span class="eyebrow">HALLOWEEN SPORTDAY</span>
  <h1 class="split">กีฬาสี</h1>
  <div class="date">วันเสาร์ที่ 31 ตุลาคม 2569</div>
</div>

<div class="mae">
  <div class="side o"><div class="sub">สีส้ม</div><h2>ส้มบี้<br>ขยี้ม่วง</h2>
    <div class="crew"><div class="grp"><img src="assets/mae-o.webp" alt=""><b class="l" style="left:16%">คุณโจ</b><b class="boss" style="left:50%"><small>แม่สี</small>คุณบอส</b><b class="r" style="left:86%">คุณแต้ว</b></div></div></div>
  <div class="side p"><div class="sub">สีม่วง</div><h2>ม่วงพุ่งปรี๊ด<br>จี๊ดถึงดาว</h2>
    <div class="crew"><div class="grp"><img src="assets/mae-p.webp" alt=""><b class="l" style="left:14%">คุณจ๋อม</b><b class="boss" style="left:49%"><small>แม่สี</small>คุณนุ๊ก</b><b class="r" style="left:86%">คุณเผือก</b></div></div></div>
  <div class="vsbadge">VS</div>
</div>

<div class="wrap">
  <svg class="floaty" style="left:27%;top:5%;width:8vh;animation-delay:-2s"><use href="#ghost"/></svg>
  <svg class="floaty" style="right:27%;top:9%;width:6.5vh;animation-delay:-.6s"><use href="#ghost"/></svg>
  <header class="head">
    <span class="eyebrow">HALLOWEEN SPORTDAY</span>
    <h1 class="title" id="title">กีฬาสี</h1>
  </header>

  <section class="board">
    <div class="team o" id="tO">
      <svg class="crown"><use href="#crown"/></svg>
      <div class="name">สีส้ม</div>
      <div class="num" id="sO">0</div>
      <div class="stats"><span>ชนะเกม <b id="gO">0</b></span><span>ชิงธง <b id="fO">0</b></span><span>เชียร์ <b id="cO">0</b></span></div>
    </div>
    <div class="vs">VS</div>
    <div class="team p" id="tP">
      <svg class="crown"><use href="#crown"/></svg>
      <div class="name">สีม่วง</div>
      <div class="num" id="sP">0</div>
      <div class="stats"><span>ชนะเกม <b id="gP">0</b></span><span>ชิงธง <b id="fP">0</b></span><span>เชียร์ <b id="cP">0</b></span></div>
    </div>
  </section>

</div>

<div class="ctl tl"><button id="fs" title="Fullscreen">⛶</button></div>

<script type="module">
import { watch, watchScreen } from './fb.js';

const COL = {o:'#ff7a1a', p:'#6b2fb3'};
let log = [];
const count = (t, v) => log.filter(x => x.t === t && x.v === v).length;
const score = t => log.filter(x => x.t === t).reduce((a,x) => a + x.v, 0);

// title letters pop in (split by Thai grapheme so vowels stay on their consonant)
const seg = new Intl.Segmenter('th', {granularity:'grapheme'});
for(const tt of document.querySelectorAll('#title, .cover h1'))
  tt.innerHTML = [...seg.segment(tt.textContent)].map((s,i) => `<span style="--i:${i}">${s.segment}</span>`).join('');

document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

let prev = null;
watch(v => { log = v; render(); });
// mae = both colours, mae-o / mae-p = one colour full width
watchScreen(v => {
  document.body.dataset.screen = v;
  for(const t of ['o','p']){
    const side = document.querySelector('.side.'+t);
    side.classList.toggle('on', v === 'mae' || v === 'mae-'+t);
    side.classList.toggle('gone', v === 'mae-'+(t === 'o' ? 'p' : 'o'));
    side.classList.toggle('solo', v === 'mae-'+t);
  }
});

function render(){
  for(const t of ['o','p']){
    const T = t.toUpperCase(), s = score(t), el = document.getElementById('s'+T);
    el.textContent = s;
    document.getElementById('g'+T).textContent = count(t, 10);
    document.getElementById('f'+T).textContent = count(t, 5);
    document.getElementById('c'+T).textContent = count(t, 2);
    if(prev && s > prev[t] && document.body.dataset.screen === 'score') celebrate(t, s - prev[t]);
    if(prev && s !== prev[t]){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
  prev = {o: score('o'), p: score('p')};
  const o = score('o'), p = score('p');
  document.getElementById('tO').classList.toggle('lead', o > p);
  document.getElementById('tP').classList.toggle('lead', p > o);
}

function celebrate(t, d){
  const card = document.getElementById('t'+t.toUpperCase()).getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'burst'; b.textContent = '+' + d;
  b.style.cssText = `left:${card.left + card.width/2}px;top:${card.top + card.height*.35}px;--c:${COL[t]}`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
  if(d < 5) return;
  for(let i=0;i<60;i++){
    const c = document.createElement('i');
    c.className = 'conf';
    const dur = 2 + Math.random()*2;
    c.style.cssText = `left:${card.left + Math.random()*card.width}px;background:${[COL[t],'#ffc533','#fff'][i%3]};--dx:${(Math.random()-.5)*30}vw;--r:${Math.random()*900}deg;animation-duration:${dur}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), (dur+.5)*1000);
  }
}

// hide controls + cursor when mouse is idle
let idleT;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
addEventListener('mousemove', wake); wake();

</script>
</body>
</html>
